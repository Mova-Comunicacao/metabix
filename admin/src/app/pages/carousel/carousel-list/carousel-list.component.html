<div class="d-flex flex-wrap flex-stack mb-6">
    <h3 class="fw-bolder my-2">
        {{ 'title.propertyDetailsH3' | translate }}
      	<span class="fs-6 text-gray-400 fw-bold ms-1">&nbsp;</span>
    </h3>
    <div class="d-flex flex-wrap my-2">
        <div class="me-4">
        </div>
        <button
            type="button"
            class="btn btn-primary fw-bolder"
            (click)="create()">
            <span
                [inlineSVG]="'./assets/media/icons/duotune/abstract/abs053.svg'"
                class="svg-icon svg-icon-3">
            </span>                        
            {{ 'btn.addBtn' | translate }}
        </button>        
    </div>    
</div>
<div #dropListContainer>
    <div 
        cdkDropList
        [cdkDropListData]="carousel$ | async"
        [cdkDropListOrientation]="'mixed'"
        (cdkDropListDropped)="dragDropped($event)"
        class="row g-6 g-xl-8">
        @for(item of (carousel$ | async); track item.id; let i = $index) {
            <div
                cdkDrag
                [cdkDragData]="i"         
                (cdkDragEntered)="dragEntered($event)"
                (cdkDragMoved)="dragMoved($event)"   				
                class="col-md-6 col-lg-4 col-xxl-3">
                <div class="card card-stretch">
                    <div class="card-body p-0">
                        <div class="overlay">
                            <div class="overlay-wrapper bgi-no-repeat bgi-position-center bgi-size-cover card-rounded min-h-275px"
                                [style.backgroundImage]="'url('+ item.thumb +')'">
                            </div>	
							<div class="overlay-layer bg-dark bg-opacity-25 align-items-end justify-content-center">
								<div class="d-flex justify-content-end flex-grow-1 flex-center p-5">
									<button (click)="edit(item.id)" class="btn btn-light-primary btn-icon me-2">
										<i class="fa fa-pen icon-lg"></i>
									</button>   									
									<button (click)="delete(item.id)" class="btn btn-light-danger btn-icon">
										<i class="fa fa-trash icon-lg"></i>
									</button>
								</div>
							</div>  													
						</div>
					</div>					
				</div>
			</div>
		}
	</div>
</div>
